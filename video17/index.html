<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selectors</title>
    <style>
        /* That is element selector  */
        /* div{
             background-color: red;
        } */
        /* that is class selector */
        .red {
            background-color: red;
        }

        /* id selector */
        #green {
            background-color: green;
        }

        /* child selector */
        div>p {
            background-color: brown;
            color: blue;
        }

        /* Decendant selector */
        div p {
            background-color: rgb(133, 66, 139);
            color: rgb(35, 113, 202);
        }

        /* Universal selector */
        * {
            padding: 0;
            margin: 0;
        }

        /* Pseudo selectors */
        a:visited {
            color: yellow;
        }

        a:link {
            color: green;
        }

        a:active {
            background-color: red;
        }

        a:hover {
            background-color: brown;
        }

        p:first-child {
            background-color: aqua;
        }
    </style>
</head>

<body>
    <!-- pseudo selectors
 class selsectors
 universal selectors
 id selectors
 element selectors
  child selectors-->
    <main class="one">
        <p>
            hey i am khani
        </p>
        <p>
            and also i am good
        </p>
    </main>
    <div class="red">
        hey i am a div
        <article>
            <p>
                i am a para inside div
            </p>
        </article>
    </div>
    <div id="green">
        hey i am another div
    </div>
    <div>
        <a href="https://www.google.com">Go to Google</a>
        <a href="https://www.facebook3.com">Go to facebook</a>
    </div>
</body>

</html>
